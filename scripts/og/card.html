<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      linear-gradient(rgba(219, 230, 242, .035) 1px, transparent 1px) 0 0 / 60px 60px,
      linear-gradient(90deg, rgba(219, 230, 242, .035) 1px, transparent 1px) 0 0 / 60px 60px,
      radial-gradient(900px 500px at 85% 0%, rgba(69, 196, 233, .12), transparent 60%),
      #0a0d12;
    color: #e8edf4;
    font-family: "IBM Plex Sans", "DejaVu Sans", sans-serif;
    display: flex; flex-direction: column; padding: 64px 80px 0;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; font-size: 34px; font-weight: 500; letter-spacing: -.01em; }
  .wordmark .caret { color: #45c4e9; }
  .chunk { font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; font-size: 20px; color: #6e7a88; }
  .chunk b { color: #45c4e9; font-weight: 500; margin-left: 10px; }
  .kicker { margin-top: 70px; font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; font-size: 22px; color: #6e7a88; letter-spacing: .06em; text-transform: uppercase; }
  h1 { margin-top: 18px; font-size: 66px; line-height: 1.08; font-weight: 600; letter-spacing: -.022em; max-width: 1000px; }
  .sub { margin-top: 28px; font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; font-size: 26px; color: #a8b3c0; }
  .sub .p { color: #45c4e9; margin-right: 12px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; height: 84px; border-top: 1px solid rgba(219, 230, 242, .1);
          font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; font-size: 21px; color: #6e7a88; }
  .foot .url { color: #a8b3c0; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #45c4e9; }
</style>
</head>
<body>
  <div class="top">
    <div class="wordmark">oce<span class="caret">▍</span></div>
    <div class="chunk" id="chunk"></div>
  </div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="foot"><span class="url">opencontextengine.com</span><span>MIT · local-first · MCP</span></div>
  <div class="bar"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("kicker").textContent = q.get("kicker") || "open context engine";
  document.getElementById("title").textContent = q.get("title") || "";
  const sub = q.get("sub");
  if (sub) document.getElementById("sub").innerHTML = '<span class="p">$</span>' + sub.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const chunk = q.get("chunk");
  if (chunk) document.getElementById("chunk").innerHTML = chunk.replace(/[&<>]/g, "") + "<b>1.00</b>";
</script>
</body>
</html>
