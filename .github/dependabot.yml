version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Grammar wasms in tree-sitter-wasms 0.1.x are built for the
      # web-tree-sitter 0.25 language ABI; 0.26+ cannot load them and every
      # AST test fails. Unignore once tree-sitter-wasms ships ABI-16 wasms.
      - dependency-name: "web-tree-sitter"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Grammar wasms in tree-sitter-wasms 0.1.x are built for the
      # web-tree-sitter 0.25 language ABI; 0.26+ cannot load them.
      # Unignore once tree-sitter-wasms ships ABI-16 wasms.
      - dependency-name: "web-tree-sitter"
        update-types: ["version-update:semver-minor"]
      # vsce refuses to package when @types/vscode exceeds engines.vscode.
      # Types stay aligned with engines.vscode (^1.103.0); bump BOTH
      # deliberately when raising the minimum VS Code version.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
