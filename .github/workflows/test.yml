# Core test suite + typechecks on every PR and main push.
#
# The release-vsix workflow only smoke-builds the extension when extension/
# files change — until this workflow, the 278-test vitest suite never ran in
# CI at all, and core-only PRs could break extension typechecking unnoticed
# (the extension imports ../src directly).

name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
# onnxruntime-node's postinstall downloads its CUDA binaries from nuget.org —
# the flakiest dependency in CI (three runs lost to it). Tests run on CPU, and
# the CPU binaries ship inside the npm package, so skip the download.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

jobs:
  test:
    # Native deps (better-sqlite3, sqlite-vec) are the #1 documented failure
    # class — test where users actually run, not just one Linux image.
    name: Vitest + core typecheck (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        node: ["22.22.0"]
        # The supported floor (22) runs everywhere; the current LTS (24) is
        # what most new installs get. Node 20 was dropped: it is end-of-life
        # and better-sqlite3 no longer ships prebuilt binaries for it, so it
        # only installs with a C++20 toolchain — package.json engines is >=22.
        include:
          - os: ubuntu-22.04
            node: "24"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # ubuntu/22.22.0 leg matches the release-vsix.yml pin — bump together.
          node-version: ${{ matrix.node }}
      - run: npm ci
      # core + Studio typecheck: TS 7 needs the css.d.ts declaration, and only
      # this composed script checks Studio — plain `tsc --noEmit` missed it once.
      - run: npm run typecheck:core
      - run: npx vitest run

  core-on-extension-sqlite:
    # The extension ships better-sqlite3 13 (Node-API, one binary for every
    # Electron) while the npm package stays on 12, whose prebuilds still load
    # on glibc < 2.34. Both run the same core code, so the core suite runs on
    # the extension's driver too. ubuntu-22.04's glibc 2.35 meets 13's floor.
    name: Core suite on the extension's SQLite driver
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
      - run: npm ci
      - name: Swap in the extension's better-sqlite3
        run: |
          VERSION=$(node -p "require('./extension/package-lock.json').packages['node_modules/better-sqlite3'].version")
          npm install --no-save "better-sqlite3@$VERSION"
          node -p "'better-sqlite3 ' + require('better-sqlite3/package.json').version"
      - run: npx vitest run

  extension-types:
    name: Extension typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
      # Extension tsc resolves imports from BOTH dependency trees: it
      # imports ../src (root deps) and its own node_modules.
      - run: npm ci
      # --ignore-scripts skips a no-op node-gyp step for better-sqlite3; see
      # the "Install extension deps" step in release-vsix.yml.
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: npx tsc --noEmit
        working-directory: extension

  extension-tests:
    name: Extension vitest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
      # Extension tests import ../src, so both dependency trees must be present
      # (same install pattern as extension-types). --ignore-scripts skips a
      # no-op node-gyp step; better-sqlite3 13 prebuilds load without it.
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: npx vitest run
        working-directory: extension
