# Release workflow for the VS Code extension.
#
# The extension's one native dependency with a Node binding is better-sqlite3.
# Since 0.4 it is on better-sqlite3 13, a Node-API addon: a single prebuilt
# binary per platform, shipped inside its npm package, loads in every Electron
# VS Code runs extensions in (37 in 1.103 through 43 in 1.139) and in plain Node
# on remote hosts (SSH, WSL, Codespaces). Before 0.4 each VSIX carried one
# binary per Electron ABI, and every Electron bump in VS Code broke the
# extension until a rebuild shipped. Nothing here compiles native code now.
#
# Each leg packages its platform's VSIX (scripts/package-vsix.mjs keeps only
# that platform's prebuild), then proves it: verify-vsix.mjs checks the
# binaries' architecture and runs a real store through the unpacked VSIX
# under Node, and the Electron step repeats that under the oldest and newest
# Electron VS Code ships.
#
# Triggers:
#  - push to a tag like v0.4.0 → build all platforms + publish to Marketplace.
#  - workflow_dispatch → build only (no publish). Useful for local sanity.
#  - pull_request touching extension/ → build all platforms as a smoke test.

name: Release VSIX

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the VS Code Marketplace after build"
        type: boolean
        default: false
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/release-vsix.yml"

# Cancel superseded runs for the same branch/tag so a fast-follow push doesn't
# leave a half-finished build holding artifacts.
concurrency:
  group: release-vsix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs run on ubuntu-22.04 (glibc 2.35), just above the
          # better-sqlite3 prebuild's floor of glibc 2.34, so the native smoke
          # below runs on the oldest glibc family we claim to support.
          - target: linux-x64
            os: ubuntu-22.04
          # Linux arm64 — GitHub's native arm64 runner.
          - target: linux-arm64
            os: ubuntu-22.04-arm
          # macOS x64 — GitHub retired macos-13; macos-15-intel is its Intel
          # successor on the free runners (macos-26-intel is the next one). A
          # retired label never fails: the job just queues forever and the
          # Marketplace publish, which needs every leg, never runs.
          - target: darwin-x64
            os: macos-15-intel
          # macOS arm64 — Apple Silicon majority.
          - target: darwin-arm64
            os: macos-latest
          # Windows x64. win32-arm64 is intentionally skipped — there is no
          # sqlite-vec-windows-arm64 npm package, so the VSIX would ship
          # without vector search. See PUBLISHING.md ("Unsupported platforms").
          - target: win32-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22.16.0
        uses: actions/setup-node@v6
        with:
          # Pinned exact: setup-node's "22.x" floats with new releases, which
          # broke deterministic builds before.
          node-version: "22.16.0"

      - name: Install core deps (repo root)
        run: npm ci

      # --ignore-scripts: lockfiles don't record better-sqlite3's
      # "gypfile": false, so a plain `npm ci` runs `node-gyp rebuild` for it.
      # That build is a no-op (the prebuild ships in the package), but node-gyp
      # still has to find a compiler first, and on windows-latest it cannot
      # recognise Visual Studio 18. No extension dependency needs an install
      # script: esbuild's binary comes from its platform package.
      - name: Install extension deps
        working-directory: extension
        run: npm ci --ignore-scripts

      - name: Package VSIX (${{ matrix.target }})
        working-directory: extension
        run: node scripts/package-vsix.mjs ${{ matrix.target }} ../artifacts

      - name: Verify VSIX contents and run it under Node
        working-directory: extension
        shell: bash
        run: |
          VSIX=$(ls ../artifacts/*-${{ matrix.target }}-*.vsix)
          echo "Verifying $VSIX"
          node ./scripts/verify-vsix.mjs "$VSIX" "${{ matrix.target }}"

      # Desktop VS Code runs extensions inside Electron, not Node. Load the same
      # binary under the Electron of VS Code 1.103 (the engines floor) and of
      # the current stable. Skipped on linux-arm64, whose runner image lacks
      # Electron's desktop libraries; the binary is the same Node-API build.
      - name: Run it under Electron (VS Code 1.103 and current stable)
        if: matrix.target != 'linux-arm64'
        working-directory: extension
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          for V in 37.2.3 43.6.0; do
            npx --yes "electron@$V" scripts/smoke-native.cjs .
          done

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Marketplace
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    # Pinned to ubuntu so the publish loop is a single bash glob. Windows
    # runners can't glob on PowerShell/cmd reliably.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"

      - name: Install vsce
        run: npm install -g @vscode/vsce@^3.6.0

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Publish each VSIX explicitly
        # vsce publish --packagePath doesn't glob, and silently picks one file
        # on shells that don't expand globs. Iterate explicitly.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          ls -la artifacts/
          shopt -s nullglob
          for vsix in artifacts/*.vsix; do
            echo "::group::Publishing $vsix"
            vsce publish --packagePath "$vsix" --pat "$VSCE_PAT"
            echo "::endgroup::"
          done
