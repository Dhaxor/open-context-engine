# Release workflow for the VS Code extension.
#
# The extension's one native dependency with a Node binding is better-sqlite3.
# Since 0.4 it is on better-sqlite3 13, a Node-API addon: a single prebuilt
# binary per platform, shipped inside its npm package, loads in every Electron
# VS Code runs extensions in (37 in 1.103 through 43 in 1.139) and in plain Node
# on remote hosts (SSH, WSL, Codespaces). Before 0.4 each VSIX carried one
# binary per Electron ABI, and every Electron bump in VS Code broke the
# extension until a rebuild shipped. Nothing here compiles native code now.
#
# Each leg packages its platform's VSIX (scripts/package-vsix.mjs keeps only
# that platform's prebuild), then proves it: verify-vsix.mjs checks the
# binaries' architecture and runs a real store through the unpacked VSIX
# under Node, and the Electron step repeats that under the oldest and newest
# Electron VS Code ships.
#
# Triggers:
#  - push to a tag like v0.4.0 → build all platforms + publish to Marketplace
#    and Open VSX.
#  - workflow_dispatch → build only (no publish) unless an input is checked.
#    "Publish to Open VSX" alone backfills the registry without re-publishing
#    an existing version to the Marketplace (vsce refuses that).
#  - pull_request touching extension/ → build all platforms as a smoke test.

name: Release VSIX

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the VS Code Marketplace after build"
        type: boolean
        default: false
      openvsx:
        description: "Publish to Open VSX after build"
        type: boolean
        default: false
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/release-vsix.yml"

# Cancel superseded runs for the same branch/tag so a fast-follow push doesn't
# leave a half-finished build holding artifacts.
concurrency:
  group: release-vsix-${{ github.ref }}
  cancel-in-progress: true
# onnxruntime-node's postinstall downloads its CUDA binaries from nuget.org —
# the flakiest dependency in CI (three runs lost to it). Tests run on CPU, and
# the CPU binaries ship inside the npm package, so skip the download.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs run on ubuntu-22.04 (glibc 2.35), just above the
          # better-sqlite3 prebuild's floor of glibc 2.34, so the native smoke
          # below runs on the oldest glibc family we claim to support.
          - target: linux-x64
            os: ubuntu-22.04
          # Linux arm64 — GitHub's native arm64 runner.
          - target: linux-arm64
            os: ubuntu-22.04-arm
          # macOS x64 — GitHub retired macos-13; macos-15-intel is its Intel
          # successor on the free runners (macos-26-intel is the next one). A
          # retired label never fails: the job just queues forever and the
          # Marketplace publish, which needs every leg, never runs.
          - target: darwin-x64
            os: macos-15-intel
          # macOS arm64 — Apple Silicon majority.
          - target: darwin-arm64
            os: macos-latest
          # Windows x64. win32-arm64 is intentionally skipped — there is no
          # sqlite-vec-windows-arm64 npm package, so the VSIX would ship
          # without vector search. See PUBLISHING.md ("Unsupported platforms").
          - target: win32-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          # Pinned exact: setup-node's "22.x" floats with new releases, which
          # broke deterministic builds before.
          node-version: "22.22.0"

      - name: Install core deps (repo root)
        run: npm ci

      # --ignore-scripts: lockfiles don't record better-sqlite3's
      # "gypfile": false, so a plain `npm ci` runs `node-gyp rebuild` for it.
      # That build is a no-op (the prebuild ships in the package), but node-gyp
      # still has to find a compiler first, and on windows-latest it cannot
      # recognise Visual Studio 18. No extension dependency needs an install
      # script: esbuild's binary comes from its platform package.
      - name: Install extension deps
        working-directory: extension
        run: npm ci --ignore-scripts

      - name: Package VSIX (${{ matrix.target }})
        working-directory: extension
        run: node scripts/package-vsix.mjs ${{ matrix.target }} ../artifacts

      - name: Verify VSIX contents and run it under Node
        working-directory: extension
        shell: bash
        run: |
          VSIX=$(ls ../artifacts/*-${{ matrix.target }}-*.vsix)
          echo "Verifying $VSIX"
          node ./scripts/verify-vsix.mjs "$VSIX" "${{ matrix.target }}"

      # Desktop VS Code runs extensions inside Electron, not Node. Load the same
      # binary under the Electron of VS Code 1.103 (the engines floor) and of
      # the current stable. Skipped on linux-arm64, whose runner image lacks
      # Electron's desktop libraries; the binary is the same Node-API build.
      - name: Run it under Electron (VS Code 1.103 and current stable)
        if: matrix.target != 'linux-arm64'
        working-directory: extension
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          for V in 37.2.3 43.6.0; do
            npx --yes "electron@$V" scripts/smoke-native.cjs .
          done

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 14

  # Two ways to publish to the Marketplace, switched by the repository variable
  # MARKETPLACE_AUTH. vsce only accepts Azure DevOps PATs scoped to "All
  # accessible organizations" — global PATs, which stop working on 2026-12-01
  # — so the VSCE_PAT path has an end date. Set MARKETPLACE_AUTH=entra once the
  # Entra ID identity exists (extension/PUBLISHING.md, "Marketplace secrets")
  # and the next tag publishes through publish-entra instead; nothing else
  # changes. Two jobs rather than one because `environment:` (what the
  # federated credential trusts) cannot be conditional on a secret.
  publish:
    name: Publish to Marketplace
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && vars.MARKETPLACE_AUTH != 'entra'
    # Pinned to ubuntu so the publish loop is a single bash glob. Windows
    # runners can't glob on PowerShell/cmd reliably.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - name: Install vsce
        run: npm install -g @vscode/vsce@^3.6.0

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Publish each VSIX explicitly
        # vsce publish --packagePath doesn't glob, and silently picks one file
        # on shells that don't expand globs. Iterate explicitly.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          ls -la artifacts/
          shopt -s nullglob
          for vsix in artifacts/*.vsix; do
            echo "::group::Publishing $vsix"
            vsce publish --packagePath "$vsix" --pat "$VSCE_PAT"
            echo "::endgroup::"
          done

  publish-entra:
    name: Publish to Marketplace (Entra ID)
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && vars.MARKETPLACE_AUTH == 'entra'
    runs-on: ubuntu-latest
    # The managed identity's federated credential trusts this environment's
    # OIDC subject, repo:Dhaxor/open-context-engine:environment:marketplace;
    # restrict the environment to v*.*.* tags so only releases get a token.
    environment: marketplace
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token for azure/login
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - name: Install vsce
        # --azure-credential needs vsce >= 2.26.1.
        run: npm install -g @vscode/vsce@^3.6.0

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      # Sign in last, right before vsce: the Azure CLI trades GitHub's
      # short-lived OIDC token for the Marketplace token on first use, and
      # fails with AADSTS700024 once that OIDC token has expired.
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity holds no Azure role; it only needs a Marketplace token.
          allow-no-subscriptions: true

      - name: Check the identity is a publisher member
        # Prints the ID the one-time setup adds under the publisher's Members,
        # and stops before any upload if it isn't there yet.
        run: |
          set -euo pipefail
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          publisher=$(node -p "require('./extension/package.json').publisher")
          echo "Marketplace member ID of this identity: $id"
          if ! vsce verify-pat --azure-credential "$publisher"; then
            echo "::error::Add $id to the $publisher publisher's Members with the Contributor role, then re-run this job. See extension/PUBLISHING.md."
            exit 1
          fi

      - name: Publish each VSIX explicitly
        # --azure-credential takes its token from the Azure CLI sign-in above.
        run: |
          set -euo pipefail
          ls -la artifacts/
          shopt -s nullglob
          for vsix in artifacts/*.vsix; do
            echo "::group::Publishing $vsix"
            vsce publish --packagePath "$vsix" --azure-credential
            echo "::endgroup::"
          done

  publish-openvsx:
    name: Publish to Open VSX
    needs: build
    # Same tags as the Marketplace publish, plus a standalone dispatch input so
    # Open VSX can be backfilled without vsce refusing the existing version.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.openvsx == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Publish each VSIX explicitly
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          set -euo pipefail
          ls -la artifacts/
          shopt -s nullglob
          count=0
          for vsix in artifacts/*.vsix; do
            echo "::group::Publishing $vsix"
            npx --yes ovsx publish --packagePath "$vsix" --pat "$OVSX_PAT"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no VSIX artifacts found"
            exit 1
          fi

      # `ovsx publish` succeeding means the upload was ACCEPTED, not that it is
      # listed: 0.7.0 reported "Published" for all five targets and never became
      # visible (an unverified namespace's uploads can be held for review). Ask
      # the public API until the release shows, and fail loudly if it doesn't.
      - name: Confirm the release is publicly listed
        run: |
          set -euo pipefail
          version=$(node -p "require('./extension/package.json').version")
          url="https://open-vsx.org/api/open-context/open-context-engine/linux-x64/$version"
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$status" = "200" ]; then
              echo "Open VSX lists open-context.open-context-engine $version."
              exit 0
            fi
            echo "attempt $attempt: $url -> $status"
            sleep 30
          done
          echo "::error::Open VSX accepted the upload but does not list $version after 10 minutes. Sign in at https://open-vsx.org (Settings > Extensions) to see why it is held — e.g. a pending review or an unverified namespace."
          exit 1
