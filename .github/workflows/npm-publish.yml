# Publish the core package to npm when a version tag lands.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Publishing authenticates with the NPM_TOKEN secret (granular publish token,
# bypasses 2FA, expires 2026-11-02). The intended replacement is npm Trusted
# Publishing (OIDC): the repository side is ready (Node 24's npm 11.x +
# id-token: write), but the registry-side trust record still needs a
# 2FA-verified re-save on the package's npm settings page — the 2026-10-26
# attempt failed with E404 (identity not matched). Once that is confirmed,
# delete the NODE_AUTH_TOKEN env below, then the token and the secret.
#
# The tag must match package.json's version — the guard step enforces it so a
# stray tag can't publish mismatched contents.
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
