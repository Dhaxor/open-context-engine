# Publish the core package to npm when a version tag lands.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Requires the NPM_TOKEN repository secret (an npm automation token).
# The tag must match package.json's version — the guard step enforces it so a
# stray tag can't publish mismatched contents.
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
