# Publish the core package to npm when a version tag lands.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Publishing uses npm Trusted Publishing (OIDC): the registry trusts this
# exact repository + workflow, so there is no NPM_TOKEN to rotate or leak —
# `id-token: write` below is the credential. The trust is configured on the
# package's npm settings page (Dhaxor/open-context-engine + npm-publish.yml);
# publish attempts from anywhere else are refused.
#
# Node 24 because its bundled npm (11.x) speaks trusted publishing; Node 22's
# npm 10 still requires a token.
#
# The tag must match package.json's version — the guard step enforces it so a
# stray tag can't publish mismatched contents.
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm publish --provenance --access public
