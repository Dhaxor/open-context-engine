# Publish the core package to npm when a version tag lands.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Publishing uses npm Trusted Publishing (OIDC): the registry trusts this
# exact repository + workflow (record saved on the package's npm settings
# page 2026-10-27 with `npm publish` permission) — `id-token: write` below is
# the credential. No NPM_TOKEN to rotate, leak, or lose to npm's Jan-2027
# removal of granular-token direct publishing.
#
# The tag must match package.json's version — the guard step enforces it so a
# stray tag can't publish mismatched contents.
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

# onnxruntime-node postinstall: skip the flaky CUDA download from nuget.org
# (the typecheck-only job never touches GPU).
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm publish --provenance --access public
